# Linux/WSL clipboard bindings for tmux copy mode. Sourced by the shared
# tmux.conf. Ships on both branches; only a linux tmux loads it.
#
# WSLg bridges xclip's X selection to the Windows clipboard automatically, so
# this needs no WSL-specific case.
bind-key -T copy-mode-vi 'y' send -X copy-pipe "xclip -selection clipboard"              # Yank to clipboard, stay in copy mode
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe "xclip -selection clipboard" # Mouse selection copies, stays in copy mode
