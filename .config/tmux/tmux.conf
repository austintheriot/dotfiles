# Vi-style copy mode bindings: platform clipboard command differs (xclip on
# Linux/WSL, pbcopy on mac). See tmux-common.conf for everything else.
bind-key -T copy-mode-vi 'y' send -X copy-pipe "pbcopy"                         # Yank to clipboard, stay in copy mode
bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe "pbcopy"            # Mouse selection copies, stays in copy mode

source-file ~/.config/tmux/tmux-common.conf
