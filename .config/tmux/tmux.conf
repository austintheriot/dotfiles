# Shared tmux configuration, platform-neutral by construction.
#
# This is the file tmux loads (and the one `config reload` re-sources). The
# only platform difference is the clipboard command in copy mode, which lives
# in tmux-mac.conf / tmux-linux.conf beside this file. Both variants ship on
# the single branch, and this file sources whichever the platform names.
#
# The variant is sourced at the END of this file, so a platform binding wins
# over any shared default with the same key.

# Use the tmux-specific terminfo entry (ships with tmux, better escape-sequence
# and attribute support than the implicit screen-256color fallback) and pass
# true color through to the outer terminal.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"

# remap prefix from 'C-b' to 'C-a'
# unbind C-b
# set-option -g prefix C-Space
# bind-key C-Space send-prefix

# TPM (Tmux Plugin Manager) Plugins #########################################################
# Note: all plugins listed below require `tpm` to be installed:
# see https://github.com/tmux-plugins/tpm
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible' # adds sensible defaults to tmux
set -g @plugin "nordtheme/tmux"

# Custom Keybindings #########################################################################
# split panes using prefix+| or -
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# unbind Ctrl+t to avoid conflict with fzf
unbind -n C-t

# enable switching panes (switching panes defaults to Alt+ combinations)
# (must use alt for these to not conflict with custom neovim keybindings)
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# windows (moving between windows defaults to Alt+ combinations)
bind -n C-M-h swap-window -t -1\; select-window -t -1
bind -n C-M-l swap-window -t +1\; select-window -t +1
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 command-prompt "select-window -t '%%'"
bind -n M-w choose-tree -Zw
bind -n M-v copy-mode

# named windows
bind -n M-c select-window -t Config
bind -n M-s select-window -t Staging
bind -n M-r select-window -t Reviews
bind -n M-o select-window -t Other
bind -n M-p select-window -t Plugins
bind -n M-t select-window -t DevTool

# window numbering
set -g base-index 1       # Start numbering windows at 1, not 0.
set -g pane-base-index 1  # Start numbering panes at 1, not 0.

# resize panes with prefix and Ctrl+hjkl
bind C-l resize-pane -R 10
bind C-k resize-pane -U 10
bind C-j resize-pane -D 10
bind C-h resize-pane -L 10

# Enable mouse mode (tmux 2.1 and above)
set -g mouse on

# Wheel scrolling inside full-screen apps (Claude Code, less, man, git log).
# tmux's default WheelUpPane binding only forwards the wheel when the app has
# requested mouse tracking; Claude Code does not (verified: its panes report
# mouse_any_flag=0 while an nvim pane beside them reports 1), so the default
# drops into tmux copy-mode and scrolls the terminal instead of the app. When
# the pane is on the alternate screen and has no mouse tracking, translate the
# wheel into scroll keys so the application scrolls its own view.
#
# Shift+Up/Shift+Down rather than PageUp/PageDown: a page key moves a half
# screen in Claude Code, and a trackpad flick sends many notches at once, so
# the view jumped far past the content on every gesture. Claude Code reads
# Shift+Up and Shift+Down as scroll-by-one-line, which is the granularity a
# trackpad needs. Bare Up/Down is not an option: Claude Code binds those to
# prompt history, so an unshifted arrow cycles previous prompts.
#
# The cost is that Shift+Up/Shift+Down is a Claude Code convention rather than
# a universal one. In less, man, and vim a shifted arrow scrolls one line the
# same way, but any alternate-screen app that ignores the modifier now gets a
# single-line move where it used to get a page.
#
# One key per notch, not three: the notches already arrive in bursts from the
# trackpad, so multiplying them reintroduces the overshoot this fixes.
bind -n WheelUpPane   if -F -t= '#{||:#{pane_in_mode},#{mouse_any_flag}}' 'send -M' \
  { if -F -t= '#{alternate_on}' 'send -t= S-Up' 'copy-mode -e' }
bind -n WheelDownPane if -F -t= '#{||:#{pane_in_mode},#{mouse_any_flag}}' 'send -M' \
  { if -F -t= '#{alternate_on}' 'send -t= S-Down' 'send -M' }

# Let escape sequences (Claude Code progress bar, desktop notifications, etc.)
# pass through tmux to the outer terminal.
set -g allow-passthrough on

# Use vi keybindings in copy mode
setw -g mode-keys vi

# Vi-style copy mode bindings (platform clipboard command lives in the
# tmux-<platform>.conf variant; everything else here is shared)
bind-key -T copy-mode-vi 'v' send -X begin-selection                            # Start visual selection
bind-key -T copy-mode-vi Escape send -X clear-selection                          # Clear selection (visual -> normal mode)
bind-key -T copy-mode-vi 'q' send -X cancel                                      # Exit copy mode

# Automatic window names ####################################################################
# Name each window after its active pane: "repo/branch" if that directory is a
# repository, otherwise the directory basename. Repositories matching
# @wname_bare_repos are named by branch alone. Rename a window yourself with
# `prefix ,` to pin a name; rename it to an empty name to hand it back.
# See ~/.scripts/tmux-update-window-names.sh for the full precedence.
set-hook -g after-new-window      'run-shell -b "~/.scripts/tmux-update-window-names.sh -w #{window_id}"'
set-hook -g after-split-window    'run-shell -b "~/.scripts/tmux-update-window-names.sh -w #{window_id}"'
set-hook -g after-select-window   'run-shell -b "~/.scripts/tmux-update-window-names.sh -w #{window_id}"'
set-hook -g after-select-pane     'run-shell -b "~/.scripts/tmux-update-window-names.sh -w #{window_id}"'
set-hook -g after-kill-pane       'run-shell -b "~/.scripts/tmux-update-window-names.sh -w #{window_id}"'
set-hook -g client-session-changed 'run-shell -b "~/.scripts/tmux-update-window-names.sh -w #{window_id}"'

# PLATFORM VARIANT ###########################################################
# The platform's clipboard bindings. Sourced after the shared bindings so a
# platform binding overrides a shared default, but before tpm, whose `run`
# line its own documentation requires to be last.
#
# -q so a missing variant is not an error.
if-shell '[ "$(uname -s)" = Darwin ]' \
    'source-file -q ~/.config/tmux/tmux-mac.conf' \
    'source-file -q ~/.config/tmux/tmux-linux.conf'

# Initialize TMUX plugin manager (tpm's own documentation requires this to be
# the last line of the file).
run '~/.tmux/plugins/tpm/tpm'
