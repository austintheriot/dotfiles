name: Branch drift (mac vs linux)

on:
  push:
    branches: [mac, linux]

jobs:
  check:
    name: Compare shared paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch both branches
        run: |
          git fetch origin mac:refs/remotes/origin/mac
          git fetch origin linux:refs/remotes/origin/linux

      - name: Check for drift
        env:
          DOTFILES_ROOT: ${{ github.workspace }}
        run: |
          # No `set -e`: the assignment below must survive a non-zero exit so
          # the output and step summary are still written before exiting.
          #
          # 2>&1 because the script writes its failure summary to stderr, and
          # command substitution captures stdout only.
          output=$(tests/check-branch-drift.sh 2>&1)
          status=$?
          echo "$output"
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            {
              has_drift=0
              has_unlabeled=0
              printf '%s' "$output" | grep -q '^diverged: ' && has_drift=1
              printf '%s' "$output" | grep -q 'match no .sync-manifest rule' && has_unlabeled=1

              if [ "$status" -eq 0 ]; then
                echo '### Branch drift check passed'
              elif [ "$has_drift" -eq 1 ] && [ "$has_unlabeled" -eq 1 ]; then
                # Both failure modes can fire in the same run: the drift loop
                # prints to stdout and the exhaustiveness phase prints to
                # stderr and exits first, so either signal alone would tell
                # only half the story.
                echo '### Branch drift and unlabeled files'
                echo
                echo 'Both problems are present: a shared path differs'
                echo 'between `mac` and `linux`, and a tracked file matches'
                echo 'no `.sync-manifest` rule. Both need fixing.'
              elif [ "$has_unlabeled" -eq 1 ]; then
                # Two distinct failures with two distinct fixes. Naming which
                # one fired saves the reader from reading the log to find out.
                echo '### Unlabeled files'
                echo
                echo 'A tracked file matches no `.sync-manifest` rule, so it'
                echo 'is invisible to the drift comparison. Label each file'
                echo 'listed below.'
              else
                echo '### Branch drift'
                echo
                echo 'A shared path differs between `mac` and `linux`.'
              fi
              echo
              echo '```'
              echo "$output"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
