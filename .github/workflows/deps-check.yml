name: Dependency bootstrap

# Runs the real bootstrap (`check-deps.sh --fix --yes`) against throwaway
# runners, so a stale install command in .my-scripts/deps/check-deps.sh is
# caught on a schedule rather than the next time a machine gets set up.
#
# The push trigger is path-filtered, deliberately. Every job here installs
# packages from the network, so a trigger that fired for every commit would
# make unrelated work fail on an upstream outage -- a GitHub API rate limit
# already failed the zoxide install on one run. Filtering to the dependency
# files keeps that exposure proportional: only about 3% of recent commits
# touched them, and a commit that does not touch them cannot break the
# bootstrap. The schedule still catches an install command that goes stale
# because something upstream changed rather than because this repo did.

on:
  push:
    paths:
      - '.my-scripts/deps/**'
      - '.github/workflows/deps-check.yml'
  schedule:
    - cron: '0 13 1,15 * *'
  workflow_dispatch:

# Read-only. No job here needs to write to the repository, and the default
# token for a scheduled run on a public repo is otherwise write-scoped.
permissions:
  contents: read

# A scheduled run and a manual run can overlap. Nothing here mutates shared
# state, so cancelling the older one is safe and avoids paying for two.
concurrency:
  group: deps-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    name: Ubuntu / apt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Bootstrap and check dependencies (apt)
        run: .my-scripts/deps/check-deps.sh --fix --yes

  macos:
    name: macOS / Homebrew
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Bootstrap and check dependencies (brew)
        run: .my-scripts/deps/check-deps.sh --fix --yes

  arch:
    name: Arch Linux / pacman
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # No --platform here: ubuntu-latest is amd64, which is the only
      # architecture upstream publishes an archlinux image for. The local
      # harness (.my-scripts/deps/test-local.sh) passes --platform
      # linux/amd64 because it also runs on Apple Silicon.
      - name: Build the Arch test image
        run: |
          docker build \
            -f .my-scripts/deps/docker/Dockerfile.arch \
            -t depcheck-arch \
            .

      - name: Bootstrap and check dependencies (pacman)
        run: docker run --rm depcheck-arch
