name: Dependency bootstrap

# Runs the real bootstrap (`config deps install --yes`) against throwaway
# runners, so a stale install command in the deps engine is caught on a
# schedule rather than the next time a machine gets set up.
#
# The push trigger is path-filtered, deliberately. Every job here installs
# packages from the network, so a trigger that fired for every commit would
# make unrelated work fail on an upstream outage -- a GitHub API rate limit
# already failed the zoxide install on one run. Filtering to the dependency
# files keeps that exposure proportional: only about 3% of recent commits
# touched them, and a commit that does not touch them cannot break the
# bootstrap. The schedule still catches an install command that goes stale
# because something upstream changed rather than because this repo did.

on:
  push:
    branches: [main]
    paths:
      - 'deps/**'
      - '.github/workflows/deps-check.yml'
      # The bootstrap job below runs setup.sh and `config init`, so a change
      # to either is a change to what this workflow verifies. Without these
      # two lines the job exists but never fires on the commits most likely
      # to break it.
      - 'setup.sh'
      - '.scripts/config/**'
      # The engine is a Rust binary now, so its source is a dependency of
      # every job here. Without these two lines the workflow exists but
      # never fires on the commits most likely to break it.
      - 'crates/**'
  schedule:
    - cron: '0 13 1,15 * *'
  workflow_dispatch:

# Read-only. No job here needs to write to the repository, and the default
# token for a scheduled run on a public repo is otherwise write-scoped.
permissions:
  contents: read

# A scheduled run and a manual run can overlap. Nothing here mutates shared
# state, so cancelling the older one is safe and avoids paying for two.
concurrency:
  group: deps-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    name: Ubuntu / apt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The engine is a Rust binary. This runner has a toolchain already, so
      # it builds natively -- no seed mount, and no toolchain installed into
      # an image whose bootstrap is under test.
      - name: Build the deps engine
        run: |
          cd crates
          cargo build --release --locked -p config-cli
          mkdir -p "$HOME/.local/bin"
          cp target/release/config-cli "$HOME/.local/bin/"

      - name: Bootstrap and check dependencies (apt)
        run: |
          "$HOME/.local/bin/config-cli" deps install --yes

  pop:
    name: Pop!_OS / apt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # A separate leg from `ubuntu` above, though both are apt. Pop!_OS is
      # one of the machines this repo is deployed to, and the property that
      # differs is not the package MANAGER but the package VERSIONS its
      # archive resolves to.
      #
      # This leg exists because of a real failure: apt's neovim on Pop is
      # 0.6.1 (22.04) or 0.9.5 (24.04), the nvim config needs 0.10 for
      # `vim.uv`, and the manifest's old bare `command -v nvim` check was
      # satisfied by both. The bootstrap called the machine ready and the
      # editor then died at startup. deps.toml now carries a `min_version` and the
      # catalog routes neovim on apt to a pinned upstream tarball.
      #
      # Measured inside the image: adding Pop's own archive does NOT change
      # the neovim candidate -- System76 does not override that package, so
      # it stays 0.9.5 from Ubuntu universe. The image asserts the archive
      # loaded (a NO_PUBKEY failure would otherwise leave this leg quietly
      # testing plain Ubuntu) and the engine has to satisfy the floor
      # without apt's help.
      - name: Build the Pop!_OS test image
        run: |
          docker build \
            -f deps/docker/Dockerfile.pop \
            -t depcheck-pop \
            .

      # The engine reaches this image through a /seed mount rather than a
      # build stage. A build stage would install a Rust toolchain into the
      # image, and rustup is itself a manifest entry -- so the image would
      # pre-satisfy the very dependency the run exists to exercise.
      - name: Build the deps engine for the container
        run: |
          deps/docker/build-seed-binary.sh \
            /tmp/seed-pop "$GITHUB_WORKSPACE"
          cp deps/docker/seed-prebuilt.sh /tmp/seed-pop/
          cp deps/docker/deps-image-entrypoint.sh /tmp/seed-pop/

      - name: Bootstrap and check dependencies (apt, Pop archive)
        run: |
          docker run --rm \
            -v /tmp/seed-pop:/seed:ro \
            -e BOOTSTRAP_PREBUILT_BIN=/seed/config-cli \
            depcheck-pop

      # The install reporting "installed neovim" is not the claim under
      # test: the engine would report that for apt's 0.9.5 too. What has to
      # hold is the VERSION on the machine afterwards, which is the fact the
      # old bare presence check could not express.
      - name: Assert the installed Neovim satisfies the floor
        run: |
          docker run --rm \
            -v /tmp/seed-pop:/seed:ro \
            -e BOOTSTRAP_PREBUILT_BIN=/seed/config-cli \
            --entrypoint /bin/sh \
            depcheck-pop -c '
              set -eu
              . /seed/seed-prebuilt.sh
              seed_prebuilt >/dev/null 2>&1
              PATH="$HOME/.local/bin:$PATH"
              export PATH
              config-cli deps install --yes >/dev/null 2>&1
              version=$(nvim --version | head -1)
              echo "installed: $version"
              case $version in
                  *v0.6.*|*v0.7.*|*v0.8.*|*v0.9.*)
                      echo "FAIL: apt vintage Neovim satisfied the floor" >&2
                      exit 1 ;;
              esac
              # A second run must converge rather than reinstall forever:
              # a floor the installer cannot satisfy would loop here.
              config-cli deps install --yes 2>&1 | grep -q "present   neovim" \
                  || { echo "FAIL: neovim did not converge to present" >&2; exit 1; }

              # The version above is NOT evidence the install works. A binary
              # separated from its share/nvim/runtime tree runs, prints its
              # version, and satisfies the manifest check, while every runtime
              # file lookup fails. That is what shipped until 2026-09-08: this
              # leg installed the broken tarball and passed on these very
              # assertions.
              #
              # -u NONE so the answer is about the INSTALL rather than about
              # the config in this repo: a config error would otherwise read
              # as a broken runtime, which is the wrong layer and the wrong
              # fix.
              #
              # nvim_get_runtime_file is the same lookup every `require` and
              # `:syntax on` performs, so it fails exactly when they would. A
              # plain isdirectory check would pass on a tree that exists but
              # is no longer on runtimepath.
              # ONE LINE, and NO APOSTROPHE ANYWHERE BELOW, comments
              # included. The whole container command is a single-quoted
              # sh -c argument, so any single quote in here closes it early.
              # The first version wrapped the Lua in single quotes and the
              # step died with exit code 127 and no output at all, before
              # the assertion could run. Local testing missed it because the
              # snippet was tried with double quotes standalone rather than
              # nested inside the real command.
              facts=$(nvim --headless -u NONE -c "lua local rt = vim.env.VIMRUNTIME or \"\"; local dir = rt ~= \"\" and vim.fn.isdirectory(rt) == 1; local found = #vim.api.nvim_get_runtime_file(\"syntax/syntax.vim\", false) > 0; io.write(rt .. \"|\" .. tostring(dir) .. \"|\" .. tostring(found))" -c "qa!" 2>/dev/null)
              echo "runtime facts: $facts"
              case $facts in
                  *"|true|true") ;;
                  *)
                      echo "FAIL: nvim cannot reach its runtime tree ($facts)" >&2
                      echo "The binary is probably installed without its share/nvim/runtime sibling." >&2
                      exit 1 ;;
              esac

              config-cli deps check >/dev/null
            '

  macos:
    name: macOS / Homebrew
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The engine is a Rust binary. This runner has a toolchain already, so
      # it builds natively -- no seed mount, and no toolchain installed into
      # an image whose bootstrap is under test.
      - name: Build the deps engine
        run: |
          cd crates
          cargo build --release --locked -p config-cli
          mkdir -p "$HOME/.local/bin"
          cp target/release/config-cli "$HOME/.local/bin/"

      - name: Bootstrap and check dependencies (brew)
        run: |
          "$HOME/.local/bin/config-cli" deps install --yes

  arch:
    name: Arch Linux / pacman
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # No --platform here: ubuntu-latest is amd64, which is the only
      # architecture upstream publishes an archlinux image for. The local
      # harness (deps/test-local.sh) passes --platform
      # linux/amd64 because it also runs on Apple Silicon.
      - name: Build the Arch test image
        run: |
          docker build \
            -f deps/docker/Dockerfile.arch \
            -t depcheck-arch \
            .

      # The engine reaches this image through a /seed mount rather than a
      # build stage. A build stage would install a Rust toolchain into the
      # image, and rustup is itself a manifest entry -- so the image would
      # pre-satisfy the very dependency the run exists to exercise. That is
      # the shape of the bug this whole port was written to stop.
      #
      # Built in a bookworm-based Rust container, NOT natively on the
      # runner. The runner is Ubuntu 24.04 (glibc 2.39) and three bootstrap
      # images are Debian bookworm (glibc 2.36), so a runner-built binary
      # cannot start inside them. build-seed-binary.sh owns that rule and is
      # the same script the local harnesses call, so the two cannot drift.
      - name: Build the deps engine for the container
        run: |
          deps/docker/build-seed-binary.sh \
            /tmp/seed-arch "$GITHUB_WORKSPACE" --platform=linux/amd64
          cp deps/docker/seed-prebuilt.sh /tmp/seed-arch/
          cp deps/docker/deps-image-entrypoint.sh /tmp/seed-arch/

      - name: Bootstrap and check dependencies (pacman)
        run: |
          docker run --rm \
            -v /tmp/seed-arch:/seed:ro \
            -e BOOTSTRAP_PREBUILT_BIN=/seed/config-cli \
            depcheck-arch

  bootstrap:
    name: Full bootstrap / bare clone
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The one job that tests the claim "ssh into a box, get my whole setup
      # from a bare git URL". The three jobs above run the deps engine
      # directly, so none of them clones, checks out, runs setup.sh or
      # `config init`, or
      # meets a $HOME that already has a .zshrc in it.
      #
      # The container starts with git, curl, sudo and certificates and nothing
      # else, as a non-root user, with a pre-existing .zshrc planted to force
      # the checkout collision a real machine would hit. It clones from a bare
      # repo built out of this checkout, so what runs is this commit's
      # setup.sh rather than whatever is on the default branch.
      - name: Build the bootstrap image
        run: |
          mkdir -p /tmp/empty-context
          docker build \
            -f deps/docker/Dockerfile.bootstrap \
            -t dotfiles-bootstrap \
            /tmp/empty-context

      # A real bare repo for the container to clone from. The seed is built
      # here rather than pointing the container at GitHub, so the job tests
      # the commit under test and needs no credentials.
      - name: Build the seed repository
        run: |
          mkdir -p /tmp/seed
          git config --global user.email ci@example.com
          git config --global user.name CI
          ref="${GITHUB_REF_NAME:-main}"
          git init -q -b "$ref" /tmp/staging
          tar -c --exclude=.git . | tar -x -C /tmp/staging
          git -C /tmp/staging add -A
          git -C /tmp/staging commit -q -m "bootstrap test tree"

          # `main` as well as the pushed ref, because the container passes no
          # --branch and setup.sh defaults to `main`. This used to create
          # `mac` and `linux` instead, for the platform-to-branch mapping that
          # the 2026-09-06 collapse removed; manufacturing those frozen names
          # here would hide a regression of the mapping.
          if [ "$ref" != main ]; then
            git -C /tmp/staging branch -q main
          fi

          git clone -q --bare /tmp/staging /tmp/seed/repo.git
          git --git-dir=/tmp/seed/repo.git symbolic-ref HEAD "refs/heads/$ref"
          cp deps/docker/bootstrap-entrypoint.sh /tmp/seed/
          cp deps/docker/seed-prebuilt.sh /tmp/seed/

          # The engine itself. It arrives through the /seed mount rather
          # than a build stage in the image: rustup is a manifest entry,
          # so a toolchain installed into the image under test would
          # pre-satisfy the very dependency the run exists to exercise.
          #
          # Built in a bookworm-based Rust container, NOT natively here. The
          # runner is Ubuntu 24.04 (glibc 2.39) and this image is older, so a
          # runner-built binary dies before main with "GLIBC_2.39 not found".
          # build-seed-binary.sh owns that rule for CI and the local
          # harnesses alike.
          deps/docker/build-seed-binary.sh \
            /tmp/seed "$GITHUB_WORKSPACE" --platform=linux/amd64

      # The entrypoint runs the bootstrap and then asserts the state a
      # finished bootstrap must leave behind: the hooks linked, `config` on
      # PATH, the git setting written, a dependency the image never carried,
      # the planted .zshrc preserved, `config init` idempotent, and setup.sh
      # refusing to re-clone over an existing ~/.cfg.
      - name: Run and verify the bootstrap
        run: |
          docker run --rm -v /tmp/seed:/seed:ro \
            -e BOOTSTRAP_PREBUILT_BIN=/seed/config-cli \
            dotfiles-bootstrap --yes

  bootstrap-bare:
    name: Full bootstrap / bare root image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The same bootstrap against a genuinely bare image: root, no sudo, no
      # git. The job above installs sudo and git and runs as a normal user,
      # which is a real shape but a comfortable one -- it hid two bugs a user
      # found in seconds on a plain `docker run debian`:
      #
      #   - every install command carried a hardcoded `sudo`, so on an image
      #     without sudo all eleven privileged installs failed with
      #     "sh: 1: sudo: not found";
      #   - setup.sh said only "install git, then run this again", which is
      #     the least useful sentence available to someone who just pasted a
      #     one-liner.
      #
      # Neither is reachable from an image that preinstalls sudo and git and
      # never runs as root, so this leg varies exactly those axes.
      - name: Build the bare bootstrap image
        run: |
          mkdir -p /tmp/empty-context
          docker build \
            -f deps/docker/Dockerfile.bootstrap-bare \
            -t dotfiles-bootstrap-bare \
            /tmp/empty-context

      - name: Build the seed repository
        run: |
          ref="${GITHUB_REF_NAME:-main}"
          mkdir -p /tmp/seed-bare
          git config --global user.email ci@example.com
          git config --global user.name CI
          git init -q -b "$ref" /tmp/staging-bare
          tar -c --exclude=.git . | tar -x -C /tmp/staging-bare
          git -C /tmp/staging-bare add -A
          git -C /tmp/staging-bare commit -q -m "bare bootstrap test tree"

          # `main` as well as the pushed ref, for the reason the job above
          # documents: the container passes no --branch, so it takes
          # setup.sh's default.
          if [ "$ref" != main ]; then
            git -C /tmp/staging-bare branch -q main
          fi

          git clone -q --bare /tmp/staging-bare /tmp/seed-bare/repo.git
          git --git-dir=/tmp/seed-bare/repo.git symbolic-ref HEAD "refs/heads/$ref"
          cp deps/docker/bootstrap-bare-entrypoint.sh /tmp/seed-bare/
          cp deps/docker/seed-prebuilt.sh /tmp/seed-bare/

          # The engine itself. It arrives through the /seed mount rather
          # than a build stage in the image: rustup is a manifest entry,
          # so a toolchain installed into the image under test would
          # pre-satisfy the very dependency the run exists to exercise.
          #
          # Built in a bookworm-based Rust container, NOT natively here. The
          # runner is Ubuntu 24.04 (glibc 2.39) and this image is older, so a
          # runner-built binary dies before main with "GLIBC_2.39 not found".
          # build-seed-binary.sh owns that rule for CI and the local
          # harnesses alike.
          deps/docker/build-seed-binary.sh \
            /tmp/seed-bare "$GITHUB_WORKSPACE" --platform=linux/amd64
          # The bare image has no git when setup.sh first runs, so the script
          # is read from the seed directory rather than out of the clone.
          cp setup.sh /tmp/seed-bare/setup.sh

      # Two phases inside the container: refuse without git while naming the
      # command that installs it, then install git and prove a PRIVILEGED
      # install actually succeeded. That last assertion is the one that would
      # have caught the hardcoded sudo.
      - name: Run and verify the bare bootstrap
        run: |
          docker run --rm -v /tmp/seed-bare:/seed:ro \
            -e BOOTSTRAP_PREBUILT_BIN=/seed/config-cli \
            dotfiles-bootstrap-bare

  bootstrap-curl:
    name: Full bootstrap / documented one-liner, fetched and piped
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The same bare image as the job above, varying a fourth axis none of
      # the other legs touch: how setup.sh ARRIVES.
      #
      # bootstrap-bare-entrypoint.sh copies setup.sh out of the seed and runs
      # it as a local file, and says so in its own comment. So the local-file
      # path is covered and the documented path -- `curl -fsSL ... | sh` --
      # is not. Three of its properties exist only when it is genuinely
      # fetched and piped: stdin is the pipe rather than a terminal (so
      # setup.sh must infer unattended by itself, with no --yes and no
      # `< /dev/null` written by a harness author), flags arrive through
      # `sh -s --`, and the clone source is a URL rather than a filesystem
      # path, which takes a different branch in setup.sh's host pre-check.
      #
      # Found on its first run that one --fix pass does not converge:
      # zsh-autosuggestions was reported unautomatable 925 lines before
      # oh-my-zsh installed the directory it needs, and a second pass
      # installs it. See docs/superpowers/specs for the fixpoint that fixes
      # this.
      - name: Build the curl-pipe bootstrap image
        run: |
          mkdir -p /tmp/empty-context
          docker build \
            -f deps/docker/Dockerfile.bootstrap-curl \
            -t dotfiles-bootstrap-curl \
            /tmp/empty-context

      - name: Build the seed repository
        run: |
          ref="${GITHUB_REF_NAME:-main}"
          mkdir -p /tmp/seed-curl
          git config --global user.email ci@example.com
          git config --global user.name CI
          git init -q -b "$ref" /tmp/staging-curl
          tar -c --exclude=.git . | tar -x -C /tmp/staging-curl
          git -C /tmp/staging-curl add -A
          git -C /tmp/staging-curl commit -q -m "curl-pipe bootstrap test tree"

          # `main` as well as the pushed ref, for the reason the jobs above
          # document: the container passes no --branch, so it takes
          # setup.sh's default.
          if [ "$ref" != main ]; then
            git -C /tmp/staging-curl branch -q main
          fi

          git clone -q --bare /tmp/staging-curl /tmp/seed-curl/repo.git
          git --git-dir=/tmp/seed-curl/repo.git symbolic-ref HEAD "refs/heads/$ref"
          cp deps/docker/bootstrap-curl-entrypoint.sh /tmp/seed-curl/
          cp deps/docker/seed-prebuilt.sh /tmp/seed-curl/

          # The engine itself. It arrives through the /seed mount rather
          # than a build stage in the image: rustup is a manifest entry,
          # so a toolchain installed into the image under test would
          # pre-satisfy the very dependency the run exists to exercise.
          #
          # Built in a bookworm-based Rust container, NOT natively here. The
          # runner is Ubuntu 24.04 (glibc 2.39) and this image is older, so a
          # runner-built binary dies before main with "GLIBC_2.39 not found".
          # build-seed-binary.sh owns that rule for CI and the local
          # harnesses alike.
          deps/docker/build-seed-binary.sh \
            /tmp/seed-curl "$GITHUB_WORKSPACE" --platform=linux/amd64

          # Served over HTTP by the container, not read from the mount. The
          # copy is what the entrypoint publishes; setup.sh must arrive by
          # curl or this leg is testing nothing the bare leg does not.
          cp setup.sh /tmp/seed-curl/setup.sh

      # The container starts its own HTTP server on 127.0.0.1, so this needs
      # no host networking and behaves identically on a laptop and here.
      # Verified to fail correctly: sabotaging setup.sh's `config init`
      # handoff produces 6 failures and exit 1.
      - name: Run and verify the curl-pipe bootstrap
        run: |
          docker run --rm -v /tmp/seed-curl:/seed:ro \
            -e BOOTSTRAP_PREBUILT_BIN=/seed/config-cli \
            dotfiles-bootstrap-curl

  bootstrap-curl-arch:
    name: Full bootstrap / one-liner on bare Arch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The same one-liner as the job above, on pacman instead of apt. This
      # is the only leg that reaches pacman through the FULL bootstrap:
      # Dockerfile.arch also targets pacman but preinstalls sudo and git and
      # only runs `config deps install`, so it cannot reach setup.sh's
      # git-bootstrap
      # path or the escalation logic on a machine with no sudo.
      #
      # What is only covered here: `pacman -Sy --noconfirm <pkg>` as the
      # privileged install shape, and the three dependencies whose pacman
      # package name differs from the default (`gh` is `github-cli`, `cc` is
      # `base-devel`, `pyyaml` is `python-yaml`). A regression in any of
      # those spellings is invisible to every other leg.
      #
      # amd64 explicitly: upstream publishes no arm64 archlinux image. The
      # runner is amd64 so this is a no-op here, and it is what lets the same
      # command work under emulation on an Apple Silicon laptop.
      - name: Build the Arch curl-pipe bootstrap image
        run: |
          mkdir -p /tmp/empty-context
          docker build --platform linux/amd64 \
            -f deps/docker/Dockerfile.bootstrap-curl-arch \
            -t dotfiles-bootstrap-curl-arch \
            /tmp/empty-context

      - name: Build the seed repository
        run: |
          ref="${GITHUB_REF_NAME:-main}"
          mkdir -p /tmp/seed-curl-arch
          git config --global user.email ci@example.com
          git config --global user.name CI
          git init -q -b "$ref" /tmp/staging-curl-arch
          tar -c --exclude=.git . | tar -x -C /tmp/staging-curl-arch
          git -C /tmp/staging-curl-arch add -A
          git -C /tmp/staging-curl-arch commit -q -m "arch curl-pipe bootstrap test tree"

          if [ "$ref" != main ]; then
            git -C /tmp/staging-curl-arch branch -q main
          fi

          git clone -q --bare /tmp/staging-curl-arch /tmp/seed-curl-arch/repo.git
          git --git-dir=/tmp/seed-curl-arch/repo.git symbolic-ref HEAD "refs/heads/$ref"
          cp deps/docker/bootstrap-curl-entrypoint.sh /tmp/seed-curl-arch/
          cp deps/docker/seed-prebuilt.sh /tmp/seed-curl-arch/

          # The engine itself. It arrives through the /seed mount rather
          # than a build stage in the image: rustup is a manifest entry,
          # so a toolchain installed into the image under test would
          # pre-satisfy the very dependency the run exists to exercise.
          #
          # Built in a bookworm-based Rust container, NOT natively here. The
          # runner is Ubuntu 24.04 (glibc 2.39) and this image is older, so a
          # runner-built binary dies before main with "GLIBC_2.39 not found".
          # build-seed-binary.sh owns that rule for CI and the local
          # harnesses alike.
          deps/docker/build-seed-binary.sh \
            /tmp/seed-curl-arch "$GITHUB_WORKSPACE" --platform=linux/amd64
          cp setup.sh /tmp/seed-curl-arch/setup.sh

      - name: Run and verify the Arch curl-pipe bootstrap
        run: |
          docker run --rm --platform linux/amd64 \
            -v /tmp/seed-curl-arch:/seed:ro \
            -e BOOTSTRAP_PREBUILT_BIN=/seed/config-cli \
            dotfiles-bootstrap-curl-arch

  bootstrap-self-built:
    name: Full bootstrap / no prebuilt engine, self-built
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # THE LEG THAT TESTS WHAT A REAL USER ACTUALLY RUNS. Every other
      # bootstrap job mounts a host-built config-cli into the image before
      # setup.sh starts, and seed-prebuilt.sh explains why that seam existed:
      # the images carry no Rust toolchain, and giving them one would
      # pre-satisfy the rustup manifest entry the run exists to exercise.
      #
      # The consequence went unnoticed for as long as the seam did. Those
      # legs were all green while the documented one-liner failed on any
      # fresh machine, because `config init` installed dependencies BEFORE it
      # built the crate and the install step was `exec config-cli deps
      # install` -- so the step depended on a binary a later step produced.
      # Reproduced in clean debian:bookworm and ubuntu:24.04:
      #
      #   config init: [3/4] install the missing tracked dependencies
      #   /root/.scripts/config/config-install: 13: exec: config-cli: not found
      #
      # The gate pre-satisfied the exact gap that broke users. That is this
      # repo's own documented fail-open shape ("a gate that falls back can
      # pass having tested a path that no longer ships") one level up: the
      # seam was not a fallback, it was the premise.
      #
      # `config prereqs` now installs cc and rustup in shell before the
      # build, so a fresh machine compiles its own engine. This leg asserts
      # that, and it is the only leg where nothing is injected. If it is ever
      # deleted or given a prebuilt binary, the circularity can return with
      # every other job still green.
      - name: Build the bare bootstrap image
        run: |
          mkdir -p /tmp/empty-context
          docker build \
            -f deps/docker/Dockerfile.bootstrap-bare \
            -t dotfiles-bootstrap-selfbuilt \
            /tmp/empty-context

      - name: Build the seed repository
        run: |
          ref="${GITHUB_REF_NAME:-main}"
          mkdir -p /tmp/seed-selfbuilt
          git config --global user.email ci@example.com
          git config --global user.name CI
          git init -q -b "$ref" /tmp/staging-selfbuilt
          tar -c --exclude=.git . | tar -x -C /tmp/staging-selfbuilt
          git -C /tmp/staging-selfbuilt add -A
          git -C /tmp/staging-selfbuilt commit -q -m "self-built bootstrap test tree"

          # `main` as well as the pushed ref: the container passes no
          # --branch, so it takes setup.sh's default.
          if [ "$ref" != main ]; then
            git -C /tmp/staging-selfbuilt branch -q main
          fi

          git clone -q --bare /tmp/staging-selfbuilt /tmp/seed-selfbuilt/repo.git
          git --git-dir=/tmp/seed-selfbuilt/repo.git symbolic-ref HEAD "refs/heads/$ref"
          cp deps/docker/bootstrap-bare-entrypoint.sh /tmp/seed-selfbuilt/
          cp deps/docker/seed-prebuilt.sh /tmp/seed-selfbuilt/
          # The bare image has no git when setup.sh first runs, so the script
          # is read from the seed directory rather than out of the clone.
          cp setup.sh /tmp/seed-selfbuilt/setup.sh

          # Deliberately NO build-seed-binary.sh call. That is the whole
          # point of this leg: the container gets source and a package
          # manager, and has to produce its own engine.

      # BOOTSTRAP_NO_PREBUILT=1 rather than simply omitting
      # BOOTSTRAP_PREBUILT_BIN. An absent variable is also what a typo or a
      # dropped `-e` produces, and seed-prebuilt.sh fails loudly on that for
      # good reason. Opting out has to be a sentence someone wrote.
      - name: Run and verify the self-built bootstrap
        run: |
          docker run --rm -v /tmp/seed-selfbuilt:/seed:ro \
            -e BOOTSTRAP_NO_PREBUILT=1 \
            dotfiles-bootstrap-selfbuilt
