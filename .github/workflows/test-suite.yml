name: Test suite (linux + macOS)

# Runs tests/run-all.sh on both platforms this repo supports.
#
# Before this existed no workflow ran the suite at all: it only ever ran from
# the local pre-push hook, so a green push meant "Docker was running on the
# author's laptop", not "CI verified this".
#
# Both platforms are required, because each covers assertions the other
# cannot:
#   - macOS reaches notify.test.sh, which drives .claude/hooks/notify.sh, and
#     the Darwin-gated Alacritty app-bundle check in deps-manifest.test.sh.
#   - Linux is where the container harness (container.test.sh,
#     run-in-docker.sh) is exercised; GitHub's macOS runners ship no Docker
#     daemon.
#
# The suite runs directly on the runner rather than in the container, which is
# what the pre-push hook uses locally. That is safe here for a reason worth
# stating: the tmux suites are flaky on a developer machine because they share
# the live tmux server with its attached client, its windows, and the six
# global after-* hooks from .config/tmux/tmux.conf that fire the
# window-naming script asynchronously. A runner is a fresh VM that never loads
# that config, so it has no client, no windows, and no hooks -- the same
# pristine conditions under which the container passes. See the tmux isolation
# entry under DEFERRED TODOS in TODO-AGENTS.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only: nothing here writes to the repository.
permissions:
  contents: read

# A force-push supersedes the run already in flight. Nothing here mutates
# shared state, so cancelling the older one is safe.
concurrency:
  group: test-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    strategy:
      # Each platform covers assertions the other skips, so a failure on one
      # must not hide the state of the other.
      fail-fast: false
      matrix:
        include:
          - label: Linux / ubuntu-latest
            runner: ubuntu-latest
          - label: macOS / macos-latest
            runner: macos-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Before the dependency installs, not after: the deps engine IS one of
      # these binaries now, so the steps below cannot run until it is built.
      # Rust is preinstalled on both runners.
      #
      # Built from inside crates/, not with --manifest-path from the repo
      # root. Two reasons, both of which failed CI once:
      #
      #   - crates/ became a Cargo workspace, so the target directory is
      #     crates/target/release, not crates/config-manifest/target/release.
      #     The old path still existed on a developer machine as a leftover
      #     from before the workspace, which is why this passed locally and
      #     failed on a clean runner.
      #   - rustup only honours crates/rust-toolchain.toml when the working
      #     directory is inside crates/. Building from the repo root used the
      #     runner's default toolchain (1.98.0) instead of the pinned 1.94.0,
      #     so the pin was declared and not applied.
      - name: Build the workspace binaries
        working-directory: crates
        run: |
          cargo build --release --locked
          echo "$GITHUB_WORKSPACE/crates/target/release" >> "$GITHUB_PATH"

      # Installed through the deps engine rather than a hand-written apt list
      # and a hand-written brew list. Those two lists named tmux, zsh, git,
      # fzf, ripgrep and shellcheck -- every one already a deps.toml entry --
      # so the package names lived in two places and the YAML copy was the one
      # that drifted, with nothing checking it. The engine already knows each
      # platform's spelling (python3-yaml on apt, python-yaml on pacman, pip
      # elsewhere), which is knowledge that does not belong in a workflow.
      #
      # Two calls, because the two manifests answer different questions.
      # --only names the deps.toml entries the SUITE needs, which is a subset:
      # a test run has no use for neovim, alacritty, aerospace, tpm or nvm, and
      # installing them here would add minutes and more upstream services that
      # can fail a run about a shell script.
      #
      # deps-ci.toml is the suite's own harness dependencies -- python3, pyyaml,
      # dash -- which are deliberately absent from deps.toml because nothing in
      # the working environment needs them.
      #
      # The full bootstrap is NOT run here. It belongs on deps-check.yml's
      # scheduled cadence: every full run installs over the network, and a push
      # about a shell script must not turn red because an upstream package
      # server is down. See the bootstrap job in that workflow.
      # DOTFILES_ROOT roots the shipped conf files. The engine falls back to
      # HOME, which on a runner is not the checkout, so without this it looks
      # in /home/runner/deps, finds nothing, parses an empty
      # manifest, and rejects every --only name as unknown.
      #
      # zsh-autosuggestions is deliberately absent. No test needs it
      # installed: deps-manifest.test.sh builds its own fixture homes and
      # reads the check command out of the conf file, and the brew branch
      # guards on `command -v brew` rather than on the install. Naming it
      # here only stalled the Linux leg, because on Linux it requires
      # oh-my-zsh, which lives in deps-linux.toml and so cannot be named on
      # a list this macOS leg also reads. The real install of that pair,
      # prerequisite ordering included, is covered unsubsetted by
      # deps-check.yml.
      - name: Install the suite's dependencies (from deps.toml)
        env:
          DOTFILES_ROOT: ${{ github.workspace }}
        run: |
          config-cli deps install --yes \
            --only tmux,zsh,git,fzf,ripgrep,shellcheck

      - name: Install the suite's harness dependencies (from deps-ci.toml)
        env:
          DOTFILES_ROOT: ${{ github.workspace }}
          # A bare file name, not a path. The engine roots a relative
          # DEPS_CONF against DOTFILES_ROOT/deps, so the fuller
          # spelling resolved to deps/deps/deps-ci.toml,
          # which does not exist. A missing conf file is tolerated by design
          # (that is how DEPS_LOCAL_CONF below excludes the platform
          # variant), so the step parsed an empty manifest, installed
          # nothing, and exited 0. The macOS leg then failed every YAML
          # assertion on a missing pyyaml, and Linux passed only because its
          # runner ships one.
          DEPS_CONF: deps-ci.toml
          # Platform detection would otherwise add deps-mac.toml or
          # deps-linux.toml on top of the CI manifest, pulling in aerospace or
          # oh-my-zsh, which the suite does not need. read_entries skips a
          # missing file, so a path that does not exist excludes the variant
          # without pretending it is empty -- the same technique the Docker
          # images use.
          DEPS_LOCAL_CONF: /nonexistent/deps-platform.toml
        run: config-cli deps install --yes

      # The lint policy lives in crates/Cargo.toml, so this step enforces it
      # rather than defining it. Explicit here as well as inside run-all.sh
      # so a lint failure is legible in the Actions UI instead of buried in a
      # suite's captured output, and so it fails before the slower suites.
      #
      # working-directory rather than --manifest-path, for the reason the
      # build step above already gives: rustup honours
      # crates/rust-toolchain.toml only when the working directory is under
      # crates/.
      - name: Clippy
        working-directory: crates
        run: cargo clippy --locked --all-targets -- -D warnings

      # A UTF-8 locale is load-bearing rather than cosmetic. With no LANG set,
      # tmux treats a tab as non-printable and substitutes "_" in
      # display-message output. The window-naming script uses a tab as its
      # field separator, so every field parse breaks and most of that suite's
      # assertions fail with mangled names.
      # .config/tmux/tmux.conf ends with a `source-file -q` of its
      # platform variant (~/.config/tmux/tmux-<platform>.conf), and tmux
      # expands that `~` against HOME rather than $DOTFILES_ROOT. Without
      # this link the source-file silently resolves to nothing -- and `-q`
      # means silently is exactly right -- so no clipboard binding is
      # applied and tmux-conf-split.test.sh fails its variant assertions.
      #
      # Linking rather than setting HOME to the checkout, which was the first
      # attempt: the checkout is a git repository, and
      # tmux-update-window-names.test.sh asserts that $HOME renders as "~".
      # The naming script only reaches that branch for a directory that is not
      # a repository, so a repository HOME renamed it "dotfiles/mac" and broke
      # the assertion. On a developer machine $HOME is not a worktree -- the
      # dotfiles repo is bare at ~/.cfg -- so both invariants hold there, and
      # linking is what reproduces that arrangement.
      - name: Link the tmux config into HOME
        run: |
          mkdir -p "$HOME/.config"
          ln -sfn "$GITHUB_WORKSPACE/.config/tmux" "$HOME/.config/tmux"

      - name: Run the test suite
        env:
          DOTFILES_ROOT: ${{ github.workspace }}
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: tests/run-all.sh
