name: vm (macOS)

# tools/vm is its own Bun package, so no other workflow runs its tests or its
# typecheck. macOS only: the video tests render overlays with the Google
# Chrome app bundle and encode with ffmpeg.
#
# crates/config-cli/tests/vm_ci.rs asserts that this workflow runs every
# package script and filters on the package's paths.

on:
  push:
    branches: [main]
    paths:
      - tools/vm/**
      - .github/workflows/vm.yml
  pull_request:
    paths:
      - tools/vm/**
      - .github/workflows/vm.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: macOS / macos-latest
    runs-on: macos-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: tools/vm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Check for Google Chrome
        run: test -x "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"

      - name: Dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check

      - name: Tests
        run: bun run test
