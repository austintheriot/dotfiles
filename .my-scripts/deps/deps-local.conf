# Linux/WSL-exclusive CLI dependencies. Excluded from .sync-manifest (see
# the `!.my-scripts/deps/deps-local.conf` line) so mac can carry its own
# unrelated version of this file. Format matches deps.conf.
#
# oh-my-zsh lives here rather than in the shared deps.conf because the mac
# machine does not use it. It must stay listed on this branch: this
# machine's zsh-autosuggestions check points into
# $HOME/.oh-my-zsh/custom/plugins, so dropping oh-my-zsh would leave that
# check depending on a directory nothing installs.

oh-my-zsh|[ -d "$HOME/.oh-my-zsh" ]|https://ohmyz.sh/
xclip|command -v xclip|https://github.com/astrand/xclip
