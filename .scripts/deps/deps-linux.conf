# Linux/WSL-exclusive CLI dependencies. Selected by platform from
# the deps engine; the mac equivalent is deps-mac.conf beside this file. Both
# ship on the single branch, selected at runtime. Format matches deps.conf.
#
# oh-my-zsh lives here rather than in the shared deps.conf because the mac
# machine does not use it. It must stay listed: the linux
# zsh-autosuggestions check points into $HOME/.oh-my-zsh/custom/plugins, so
# dropping oh-my-zsh would leave that check depending on a directory nothing
# installs.

oh-my-zsh|[ -d "$HOME/.oh-my-zsh" ]|https://ohmyz.sh/
xclip|command -v xclip|https://github.com/astrand/xclip
