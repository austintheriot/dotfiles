# Shared CLI dependencies, tracked identically on every branch (see
# .sync-manifest). Format: name|check_command|docs_url
#
# check-deps.sh (.scripts/deps/check-deps.sh) reads this file plus, if
# present, deps-local.conf in the same directory, for platform-exclusive
# dependencies. See README.md in this directory for the install-command
# logic and how to add a new entry.
#
# A check_command must not contain a literal `|`. read_entries() splits each
# line with `IFS='|' read -r name check docs`, so a shell pipe or a `||` in
# the check field truncates the check and leaks the remainder into docs_url.
# For an either-or check, use `test A -o B` or a single-line
# `if ...; then true; else ...; fi` instead.
#
# Checks accept either platform's install shape, because this file is shared:
# alacritty is a .app bundle on macOS and a binary on PATH on Linux, and
# zsh-autosuggestions comes from Homebrew's share directory on macOS and from
# an oh-my-zsh custom plugin on Linux. oh-my-zsh itself is not shared -- it
# lives in each branch's deps-local.conf, so no ordering between it and
# zsh-autosuggestions is guaranteed here.

git|command -v git|https://git-scm.com/downloads
gh|command -v gh|https://cli.github.com/
alacritty|if test -d /Applications/Alacritty.app; then true; else command -v alacritty; fi|https://alacritty.org/
zsh|command -v zsh|https://www.zsh.org/
zsh-autosuggestions|test -f "$HOME/.oh-my-zsh/custom/plugins/zsh-autosuggestions/zsh-autosuggestions.zsh" -o -f "$(brew --prefix 2>/dev/null)/share/zsh-autosuggestions/zsh-autosuggestions.zsh"|https://github.com/zsh-users/zsh-autosuggestions
neovim|command -v nvim|https://neovim.io/
fzf|command -v fzf|https://github.com/junegunn/fzf
ripgrep|command -v rg|https://github.com/BurntSushi/ripgrep
zoxide|command -v zoxide|https://github.com/ajeetdsouza/zoxide
tmux|command -v tmux|https://github.com/tmux/tmux
tpm|[ -d "$HOME/.tmux/plugins/tpm" ]|https://github.com/tmux-plugins/tpm
shellcheck|command -v shellcheck|https://www.shellcheck.net/
cc|command -v cc|https://gcc.gnu.org/
rustup|command -v rustup|https://www.rust-lang.org/tools/install
nvm|[ -s "$HOME/.nvm/nvm.sh" ]|https://github.com/nvm-sh/nvm
