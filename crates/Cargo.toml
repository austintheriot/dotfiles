# Workspace root for the dotfiles crates.
#
# One lockfile and one resolution, so a dependency exists at one version
# across every binary. The members list is also what `config stamp` and
# `config build` enumerate, which makes this the single place that says which
# crates exist.
#
# Keep members on one line. `.scripts/config/config-stamp` reads this list
# with sed, because it must work before any binary exists, and a multi-line
# array would silently yield no members. config-stamp aborts on an empty list
# rather than iterating zero crates.
[workspace]
resolver = "3"
members = ["config-cli", "config-manifest", "deps-core", "dotfiles-path", "dotfiles-test-support", "tmux-core", "tmux-tools"]

# Lint policy lives here rather than in a command line, because a command
# line binds one invocation: an IDE, a bare `cargo clippy`, and CI would all
# disagree with the gate. The gates' `-D warnings` enforces this policy; it
# is not the policy.
#
# Measured before adopting. clippy::pedantic wholesale produced 41
# must_use_candidate warnings on builders already used positionally, which is
# noise, so pedantic is not enabled as a group.
[workspace.lints.rust]
# forbid, not deny: forbid cannot be lifted by a local #[allow]. Nothing in
# these crates needs unsafe, and deps-core's whole design argument is that it
# holds no capabilities.
unsafe_code = "forbid"
missing_docs = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
format_push_string = "warn"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "env"] }
tempfile = "3.27.0"
# No `display`: this is a reader, and a writer would invite a
# re-serialization path that reformats a hand-edited file.
#
# `serde` carries the manifest schema's shape layer: deps-core derives
# `Deserialize` with `deny_unknown_fields` for field names and types, then
# converts into its own closed types, where the rules a derive cannot state
# live (exactly one check per entry, `min_version` requiring `command`,
# python imports only in an explicitly named file).
toml = { version = "0.9.8", default-features = false, features = ["parse", "serde"] }
# Derive only, for the manifest schema. `serde_core` and `serde_derive` are
# already in the lockfile transitively via `toml`, so naming serde directly
# makes an existing edge explicit rather than adding a crate to the graph.
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
