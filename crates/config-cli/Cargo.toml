[package]
name = "config-cli"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
config-manifest = { path = "../config-manifest" }
deps-core = { path = "../deps-core" }
dotfiles-path = { path = "../dotfiles-path" }

[dev-dependencies]
# Drives the scripts and hooks the converted Group 2 suites take as their
# subject, asserting on exit status and output the way `lib.sh` did.
assert_cmd = "2"
dotfiles-test-support = { path = "../dotfiles-test-support" }
# `default-features = false` drops the crate's own CLI and HTML renderer,
# which the Markdown-reading tests do not use.
pulldown-cmark = { version = "0.13", default-features = false }
# Reads the workflows as YAML instead of by regex. workflow-labels.test.sh
# shelled out to an inline Python parser for the same job, so its own
# author had already reached for a real parser.
yaml_serde = "0.10"
tempfile = { workspace = true }

[lints]
workspace = true
