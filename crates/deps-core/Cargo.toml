[package]
name = "deps-core"
edition = "2024"
version = "0.1.0"
publish = false

# dotfiles-path only among the local crates, deliberately. An edge to
# config-manifest would make the dependency domain depend on the git-sync
# domain and carry its 595-line git module into a crate that never calls it
# (spec 7.1).
#
# `toml` and `serde` are the third-party dependencies, and they are here
# rather than in config-cli on purpose: this crate owns the `Manifest` type
# and the closed `Check` sum the manifest parses into, so the parser belongs
# beside them. What stays out is the IO. Nothing here opens a file or knows a
# path -- `parse_manifest_toml` takes a `&str` and config-cli is what reads
# it. Parsing in the core, IO in the shell.
#
# serde does the shape layer (field names, field types,
# `deny_unknown_fields`) and this crate's `TryFrom` does every rule serde
# cannot state: exactly one check kind per entry, `min_version` requiring
# `command`, `python_import` requiring an explicitly named file, and
# validation into the refined types. Measured, on why the split is worth a
# derive rather than a hand-walked `toml::Table`: for a `min_verison` typo
# serde names the bad key and lists all nine valid ones with a line and
# column, and for `command = 42` it reports the expected type. The
# hand-written mapping returned a bare `Unrecognized` for the second and
# named no alternatives for the first.
#
# The workspace pin drops `display`, so this is a reader with no writer.
[dependencies]
dotfiles-path = { path = "../dotfiles-path" }
toml = { workspace = true }
serde = { workspace = true }

[lints]
workspace = true
