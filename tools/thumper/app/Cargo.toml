[package]
name = "thumperd"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The thumper daemon: toast panel, socket and tmux focus."

[lints]
workspace = true

[dependencies]
thumper-core = { path = "../../../crates/thumper-core", features = ["ts"] }
thumper-daemon = { path = "../daemon" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tauri = { version = "=2.12.4", features = ["macos-private-api"] }
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "signal", "sync", "time"] }
tracing = "=0.1.44"
tracing-appender = "=0.2.5"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "std"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", features = ["NSApplication", "NSPanel", "NSResponder", "NSRunningApplication", "NSScreen", "NSWindow", "NSWorkspace"] }
objc2-foundation = "=0.3.2"
tauri-nspanel = "=2.1.1"

[dev-dependencies]
tempfile = "3.27"

[build-dependencies]
png = "=0.18.1"
tauri-build = { version = "=2.7.3", features = [] }
