[package]
name = "thumper-daemon"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The platform-neutral shell of thumperd: socket, actor, tmux adapter."

[lints]
workspace = true

[dependencies]
thumper-core = { path = "../../../crates/thumper-core", features = ["ts"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
tracing = "=0.1.44"
ts-rs = "=12.0.1"

[dev-dependencies]
dotfiles-test-support = { path = "../../../crates/dotfiles-test-support" }
tempfile = "3.27"
